(()=>{const c=document.getElementById('game'),ctx=c.getContext('2d'),$=id=>document.getElementById(id);let driving=false,gas=0,brake=0,x=80,y=230,vx=0,vy=0,angle=0,angV=0,cam=0,meters=0,damage=0,last=0,rotation=0,trackMarks=[];let cfg={},engineRPM=700,gear=1,limiterCut=0,lowRange=false,fuelUsed=0,mpg=0,rocks=[];const W=900,H=450;let audio=null,engineOsc=[],engineGain=[],boostOsc=null,boostGain=null,boostVal=0,prevThrottle=0,bovGain=null,bovFilter=null,bovSource=null,superWhine=null,superGain=null;function initAudio(){if(audio)return;try{audio=new (window.AudioContext||window.webkitAudioContext)();let master=audio.createGain();master.gain.value=.7;master.connect(audio.destination);for(let i=0;i<5;i++){let o=audio.createOscillator(),g=audio.createGain(),f=audio.createBiquadFilter();o.type=i===0?'sawtooth':i===1?'square':'triangle';f.type='lowpass';f.frequency.value=i===0?900:1800;g.gain.value=0;o.connect(f);f.connect(g);g.connect(master);o.start();engineOsc.push(o);engineGain.push(g)}boostOsc=audio.createOscillator();boostOsc.type='sawtooth';boostGain=audio.createGain();boostGain.gain.value=0;let bf=audio.createBiquadFilter();bf.type='highpass';bf.frequency.value=900;boostOsc.connect(bf);bf.connect(boostGain);boostGain.connect(master);boostOsc.start();let buffer=audio.createBuffer(1,audio.sampleRate*2,audio.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*.5;let noise=audio.createBufferSource();noise.buffer=buffer;noise.loop=true;let nf=audio.createBiquadFilter(),ng=audio.createGain();nf.type='lowpass';nf.frequency.value=420;ng.gain.value=0;noise.connect(nf);nf.connect(ng);ng.connect(master);noise.start();engineOsc.push(noise);engineGain.push(ng);engineOsc.push(nf);bovSource=audio.createBufferSource();bovSource.buffer=buffer;bovSource.loop=true;bovFilter=audio.createBiquadFilter();bovFilter.type='lowpass';bovFilter.frequency.value=2300;bovFilter.Q.value=.65;bovGain=audio.createGain();bovGain.gain.value=0;bovSource.con function audioTick(){if(!audio)return;let throttle=gas,rpm=Math.max(700,engineRPM),normalized=Math.min(1,rpm/(cfg.limiter||7000)),now=audio.currentTime;let audible=cfg.sound==='off'?0:(driving?.22+throttle*.22:0);for(let i=0;i<5;i++){let harmonic=i+1;engineOsc[i].frequency.setTargetAtTime(Math.max(25,(rpm/60)*harmonic*.5),now,.025);engineGain[i].gain.setTargetAtTime(audible*(i===0?.25:i===1?.14:i===2?.09:i===3?.045:.025),now,.035)}let turbo=['turbo','twinTurbo','sequential'].includes(cfg.boost),supercharged=cfg.boost==='super';let b=cfg.sound==='off'?0:(turbo?boostVal:supercharged?throttle*.7:0);boostOsc.frequency.setTargetAtTime(700+b*3000,now,.035);boostGain.gain.setTargetAtTime(turbo?b*.07:0,now,.04);engineGain[5].gain.setTargetAtTime(audible*(.04+throttle*.13),now,.04);engineOsc[6].frequency.setTargetAtTime(400+normalized*700,now,.05);if(superWhine){let whineHz=700+(rpm/(cfg.limiter||7000))*5600;superWhine.frequency.setTargetAtTime(whineHz,now,.025);superGain.gain.setTargetAtTime(cfg.sound==='off'||!supercharged||!driving?0:(.012+throttle*.04),now,.06)}if(bovGain){let liftOff=prevThrottle>.48&&throttle<.12&&boostVal>.12&&turbo&&driving&&cfg.sound!=='off';if(liftOff){bovGain.gain.cancelScheduledValues(now);bovGain.gain.setValueAtTime(.0001,now);bovGain.gain.exponentialRampToValueAtTime(.11*Math.min(1,boostVal*1.5),now+.045);bovGain.gain.exponentialRampToValueAtTime(.0001,now+.38+boostVal*.25);bovFilter.frequency.setTargetAtTime(950+boostVal*1500,now,.035)}else if(!turbo||cfg.sound==='off'){bovGain.gain.setTargetAtTime(0,now,.06)}}prevThrottle=throttle}
function read(){cfg={vehicle:$('vehicle').value,color:$('paint').value,lift:+$('lift').value,tires:+$('tires').value,susp:+$('susp').value,wheels:$('wheels').value,bumper:+$('bumper').value,decal:+$('decal').value,boost:$('boost').value,sound:$('sound').value,limiter:+$('limiter').value,pipe:+$('pipe').value}}function concreteZone(q){let cycle=((q%1800)+1800)%1800;return cycle>520&&cycle<980}function terrain(q){let base=337+Math.sin(q*.0037)*18+Math.sin(q*.0105)*9+Math.sin(q*.022)*4;let broad=Math.sin(q*.00042)*24+Math.sin(q*.0011)*18;let randomHill=Math.sin(q*.00023+1.7)*32+Math.sin(q*.00071+3.1)*19+Math.sin(q*.0017+4.2)*9;let rough=base+broad+randomHill;if(concreteZone(q)){let blend=Math.min(1,(q%1800-520)/45,(980-q%1800)/45);blend=Math.max(0,blend);return rough*(1-blend)+326*blend}return rough}function reset(){x=80;y=230;vx=0;vy=0;engineRPM=700;gear=1;lowRange=false;limiterCut=0;angle=0;angV=0;cam=0;meters=0;damage=0;gas=brake=0;trackMarks=[];fuelUsed=0;mpg=0}function drawTruck(px,py){ctx.save();ctx.translate(px,py);ctx.rotate(angle);let liftY=cfg.lift*6,r=16+cfg.tires*3.2,axles=[-58,57];for(let dx of axles){ctx.save();ctx.translate(dx,25+liftY);ctx.rotate(rotation);ctx.fillStyle='#171717';ctx.beginPath();ctx.ellipse(0,0,r,r*1.08,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#555';ctx.lineWidth=2;ctx.stroke();ctx.strokeStyle='#999';ctx.lineWidth=3;for(let i=0;i<8;i++){ctx.rotate(Math.PI/4);ctx.beginPath();ctx.moveTo(-r*.65,0);ctx.lineTo(r*.65,0);ctx.stroke()}ctx.fillStyle=cfg.wheels;ctx.beginPath();ctx.arc(0,0,r*.38,0,Math.PI*2);ctx.fill();ctx.restore();ctx.strokeStyle='#bbb';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(dx,10);ctx.lineTo(dx,25+liftY);ctx.stroke()}

function render(){ctx.clearRect(0,0,W,H);let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#d7c39a');sky.addColorStop(1,'#e0b877');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.fillStyle='#c6a06d';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(W,0);ctx.lineTo(W,180);ctx.lineTo(0,205);ctx.fill();ctx.fillStyle='#b48652';ctx.beginPath();ctx.moveTo(0,H);for(let i=0;i<=W;i+=4)ctx.lineTo(i,terrain(i+cam));ctx.lineTo(W,H);ctx.closePath();ctx.fill();for(let i=0;i<W;i+=4){if(concreteZone(i+cam)){let yy=terrain(i+cam);ctx.fillStyle='#8b9092';ctx.fillRect(i,yy-3,4,H-yy+3)}}for(let i=-30;i<W;i+=30){let q=i+cam;ctx.fillStyle='#d0ac79';ctx.beginPath();ctx.ellipse(i,terrain(q)+12,6,3,0,0,Math.PI*2);ctx.fill()}for(let i=0;i<W;i+=210){let yy=terrain(i+cam);ctx.fillStyle='#71614a';ctx.beginPath();ctx.moveTo(i,yy);ctx.lineTo(i+15,yy-12);ctx.lineTo(i+32,yy);ctx.fill()}trackMarks.forEach(t=>{let tx=t.x-cam;if(tx>-10&&tx<W){ctx.fillStyle='#80613f';ctx.beginPath();ctx.ellipse(tx,t.y,14,4,0,0,Math.PI*2);ctx.fill()}});drawTruck(300,y);ctx.fillStyle='#222';ctx.font='bold 20px system-ui';ctx.fillText(driving?'DUNE RUN':'GARAGE',20,32);if(!driving){ctx.font='bold 16px system-ui';ctx.fillText($('vehicle').options[$('vehicle').selectedIndex].text,20,78);}if(driving){ctx.font='bold 18px system-ui';ctx.fillText(Math.round(vx*3.6)+' MPH',W-125,32);ctx.fillText(Math.round(meters)+' m',W-125,58);ctx.fillText((lowRange?'4 LOW':'4 HIGH')+'  |  GEAR '+gear,W-220,110);ctx.fillText(['turbo','twinTurbo','sequential'].includes(cfg.boost)?cfg.boost.toUpperCase()+' '+(boostVal*boostTarget).toFixed(1)+' PSI':cfg.boost==='super'?'SUPER '+(boostVal*boostTarget).toFixed(1)+' PSI':'0.0 PSI',W-220,84)}else{ctx.font='13px system-ui';ctx.fillText('BUILD YOUR 4x4',20,54)}}
function step(t){let dt=Math.min((t-last)/1000,.025)||0;last=t;if(driving){let groundY=terrain(x),wheelR=16+cfg.tires*3.2,target=groundY-wheelR-26-cfg.lift*6;let onGround=y>=target;let hillSlope=(terrain(x+12)-terrain(x-12))/24;if(onGround){let stiffness=cfg.susp===1?110:cfg.susp===2?280:200,damp=cfg.susp===1?6:cfg.susp===2?17:11;vy+=(target-y)*stiffness*dt-vy*damp*dt;if(y>target){y=target;if(vy>0)vy=0}}else vy+=520*dt;let mass=1+cfg.lift*.13+cfg.tires*.18+cfg.susp*.12,traction=Math.max(.25,1-cfg.tires*.08);if(['turbo','twinTurbo','sequential'].includes(cfg.boost)){let spoolBase=cfg.boost==='sequential'?(vx<85?.75:1):cfg.boost==='twinTurbo'?.9:1;let seqBlend=cfg.boost==='sequential'?Math.max(.35,Math.min(1,(vx-35)/90+.35)):1;let desired=gas?Math.min(1,(vx/155+gas*.42)*spoolBase*seqBlend):boostVal*.35;boostVal+=(desired-boostVal)*dt*(cfg.pipe>=3.5?2.35:1.55);boostVal=Math.max(0,Math.min(1,boostVal))}else if(cfg.boost==='super'){boostVal=gas*.78}else boostVal=0;let mph=vx*.36;let rpmTarget=700+mph*(gear===1?105:gear===2?78:gear===3?58:gear===4?45:35)*(lowRange?1.65:1)+gas*220;engineRPM+=(rpmTarget-engineRPM)*Math.min(1,dt*5);if(engineRPM>=cfg.limiter){engineRPM=cfg.limiter;limiterCut=Math.min(1,limiterCut+dt*10)}else limiterCut=Math.max(0,limiterCut-dt*5);let baseHP=cfg.vehicle==='tacoma'?190:cfg.vehicle==='wrangler'?205:cfg.vehicle==='bronco'?245:cfg.vehicle==='land'?220:cfg.vehicle==='xj'?190:185;let boostMultiplier=['turbo','twinTurbo','sequential'].includes(cfg.boost)?1+boostVal*(boostTarget/10)*.42:cfg.boost==='super'?1+boostVal*(boostTarget/10)*.32:1;let hp=baseHP*boostMultiplier*(1+cfg.tires*.015)*enginePowerFactor*(cfg.pipe>=3.5?1.04:1);$('hp').textContent=Math.round(hp)+' HP';let loadFactor=1+Math.max(0,hillSlope)*2.5+(lowRange?.18:0)+(cfg.tires*.08);fuelUsed+=dt*(gas*.00008*loadFactor+Math.max(0,vx)*.000001);mpg=meters/Math.max(fuelUsed*1000,0.01);$('mpg').textContent=(mpg>0?mpg.toFixed(1):'0.0')+' MPG';let power=boostMultiplier*enginePowerFactor;let gearRatio=[0,1.32,1.02,.78,.61,.48][gear]||.48;power*=gearRatio*(lowRange?3.15:1)*torqueMultiplier;if(limiterCut>.5)power*=.12;let hillResistance=Math.max(-.12,Math.min(.32,hillSlope*.45));if(gas&&onGround)vx+=gas*(285*traction/mass*power-hillResistance*150)*dt;if(gas&&!onGround)vx+=gas*30*power*dt;if(onGround&&vx>0)vx-=Math.max(0,hillResistance)*(lowRange?42:95)*dt;if(brake){vx*=Math.max(0,1-brake*3*dt);if(onGround)vy-=brake*18*dt}vx*=Math.pow(onGround?.975:.996,dt*60);let aeroDrag=Math.max(0,vx)*Math.max(0,vx)*.00045;vx-=aeroDrag*dt;vx=Math.max(-30,Math.min(900,vx));x+=vx*dt;y+=vy*dt;let slope=Math.atan((terrain(x+55)-terrain(x-55))/110);angV+=(slope-angle)*dt*4.5;angV*=.91;angle+=angV*dt;rotation+=vx*dt/(16+cfg.tires*3.2);if(onGround&&Math.abs(vy)>130)damage+=Math.abs(vy)*.001;meters+=Math.max(0,vx)*dt*.05;cam=x-300;if(vx>3&&Math.random()<.18)trackMarks.push({x:x-60,y:terrain(x-60)+4});if(trackMarks.length>160)trackMarks.shift();$('boostGauge').textContent=(['turbo','twinTurbo','sequential'].includes(cfg.boost)?boostVal*Math.min(35,boostTarget):cfg.boost==='super'?boostVal*Math.min(35,boostTarget):0).toFixed(1)+' PSI';$('speed').textContent=Math.round(vx*.36)+' MPH';$('rpm').textContent=Math.round(engineRPM)+' RPM'+(limiterCut>0.2?' LIMIT':'');$('distance').textContent=Math.round(meters)+' m';$('status').textContent=damage>12?'HARD LANDING':limiterCut>0.2?'LIMITER':'RUNNING'}awardDistance();audioTick();render();requestAnimationFrame(step)}function setMode(d){driving=d;$('build').classList.toggle('hidden',d);$('controls').classList.toggle('hidden',!d);$('shiftrow').classList.toggle('hidden',!d);$('buildTab').classList.toggle('active',!d);$('driveTab').classList.toggle('active',d);$('status').textContent=d?'READY':'GARAGE';$('hint').textContent=d?'Concrete stretches are smoother; rough trail sections wear parts faster. Hold GAS and BRAKE.':'Build your rig. Upgrades can be purchased and improved up to 3 levels.';if(d)reset()}function hold(id,set){let b=$(id),down=e=>{e.preventDefault();if(id==='gas')initAudio();if(audio&&audio.state==='suspended')audio.resume();set(1)},up=e=>{e.preventDefault();set(0)};b.addEventListener('pointerdown',down);['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,up))} $('buildTab').onclick=()=>setMode(false);$('driveTab').onclick=()=>setMode(true);$('reset').onclick=reset;$('upshift').onclick=()=>{gear=Math.min(5,gear+1);engineRPM=Math.max(700,engineRPM*.78)};$('downshift').onclick=()=>{gear=Math.max(1,gear-1);engineRPM=Math.min(cfg.limiter,engineRPM*1.25)};$('range').onclick=()=>{lowRange=!lowRange;$('range').textContent=lowRange?'4 LOW ON':'4 LOW OFF';$('range').style.background=lowRange?'#c18a42':''};['vehicle','paint','lift','tires','susp','wheels','bumper','decal','boost','sound','limiter','pipe'].forEach(id=>$(id).onchange=read);hold('gas',v=>gas=v);hold('brake',v=>brake=v);$('fullscreen').onclick=()=>{if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});else $('hint').textContent='Use Add to Home Screen for a full-screen feel.'};

function addBoostOption(value,label){let sel=$('boost');if(!Array.from(sel.options).some(o=>o.value===value)){let opt=document.createElement('option');opt.value=value;opt.textContent=label;sel.appendChild(opt)}}
 function buy(k){let cost=prices[k];if(k==='repair'){if(money>=cost){money-=cost;wearPct=Math.max(0,wearPct-45);$('wear').textContent='Wear: '+Math.round(wearPct)+'%';$('cash').textContent='$'+money;}else alert('Not enough cash.');return}let level=ownedParts[k]||0;if(level>=3){alert('This upgrade is already at level 3.');return}cost=Math.round(cost*(level?1+level*.7:1));if(money<cost){alert('Not enough cash.');return}money-=cost;ownedParts[k]=level+1;let gain=1+Object.values(ownedParts).reduce((a,b)=>a+b,0)*.012;enginePowerFactor=Math.min(1.22,gain);torqueMultiplier=Math.min(1.3,1+ownedParts.injectors*.04+ownedParts.fuelPump*.035+ownedParts.exhaust*.03);if(k==='roots'||k==='twinScrew'||k==='centrifugal'){addBoostOption('super','Supercharger');cfg.boost='super';$('boost').value='super'}if(k==='turboSmall'||k==='turboLarge'){addBoostOption('turbo','Single turbo');cfg.boost='turbo';$('boost').value='turbo'}if(ownedParts.turboSmall&&ownedParts.turboLarge)addBoostOption('twinTurbo','Twin turbo');$('owned').textContent='Owned: '+Object.keys(ownedParts).filter(a=>ownedParts[a]).map(a=>labels[a]+' Lv.'+ownedParts[a]).join(', ');$('cash').textContent='$'+money;read();b.textContent=labels[k]+' Lv.'+(ownedParts[k]+1)+' $'+Math.round(prices[k]*(1+ownedParts[k]*.7));}
